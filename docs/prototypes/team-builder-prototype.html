<title>Team Builder Prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=DM+Sans:wght@400;500;600;800&display=swap">
<style>

.stack{display:flex;flex-direction:column;gap:20px}

textarea{width:100%;min-height:300px;line-height:1.5;box-sizing:border-box;resize:vertical}

tfoot td{background:var(--warm);font-weight:600}

.ok{background:var(--e-bg);border:1px solid #A7F3D0;color:var(--e-fg);border-radius:12px;padding:10px 12px;font-size:13.5px}
.toggle{flex-direction:row;align-items:center;gap:8px;font-size:14px;color:var(--ink)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.tool{font:inherit;font-size:12.5px;font-weight:600;color:var(--emerald);background:var(--pale);border:1.5px solid #A7F3D0;border-radius:50px;padding:5px 12px;cursor:pointer;transition:all .25s var(--ease)}

.item{display:grid;grid-template-columns:1fr auto;gap:6px 16px;padding:14px 0;border-top:1px solid var(--rule)}

.item p{grid-column:1/-1;font-size:13.5px}
.foot{font-size:12.5px;color:var(--muted);border-top:1.5px solid var(--rule);padding-top:16px;margin-top:8px}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.45);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}
.modal .box{background:var(--paper);border-radius:20px;max-width:520px;width:100%;padding:28px;box-shadow:0 16px 56px rgba(0,0,0,.1);display:flex;flex-direction:column;gap:12px}
@media (max-width:640px){h1{font-size:38px}.maprow{grid-template-columns:1fr;gap:4px}.card,.navy{padding:18px}.shape{grid-template-columns:1fr;justify-items:center}.plegend{justify-self:stretch}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

 const lo=Math.max(2,Math.round(S.acts.length/4));return {lo,hi:lo+1,why:'No hours were found in the document, so the range is estimated from the number of activities. Add hours and weeks for a firmer range.'}}
function seats(n){const bp=byProfile();const q=TAGS.map(t=>({t,q:bp[t]*n}));const out=[];q.forEach(x=>{x.f=Math.floor(x.q);x.r=x.q-x.f;for(let i=0;i<x.f;i++)out.push(x.t)});
 q.sort((a,b)=>b.r-a.r);let i=0;while(out.length<n&&i<q.length){if(q[i].q>0)out.push(q[i].t);i++}
 return out.map((p,i)=>({k:'s'+i,name:'Seat '+String.fromCharCode(65+i),profile:p,avail:100}))}

function build(){const hc=headcount();const ideal=seats(Math.min(8,Math.max(2,hc.lo)));const usingRoster=S.useRoster&&S.roster.length>0;
 const people=(usingRoster?S.roster:ideal).map(p=>({...p,role:ROLE[p.profile],cap:(+p.avail||100)/100*(+S.weeks||12)*40,load:0,E:0,N:0,D:0,items:[]}));
 const rows=[];
 const val=(p,a)=>score(p.profile,a.tag)-35*(p.load/p.cap);
 [...S.acts].map(a=>({a,h:hoursOf(a)})).sort((x,y)=>y.h-x.h).forEach(({a,h})=>{
  const order=[...people].sort((x,y)=>val(y,a)-val(x,a));const owner=order[0];if(!owner)return;
  let contribs=[];
  if(a.mode==='Whole team')contribs=order.slice(1);
  else{const n=a.mode==='Pair'?1:a.mode==='Small team'?2:0;contribs=order.slice(1).filter(p=>score(p.profile,a.tag)>=40).slice(0,n)}
  let rev=null;const t=tert(owner.profile);
  if((parts(a.tag).includes(t)||DELIV.has(a.tax))&&!contribs.some(p=>prim(p.profile)===t)){const c=people.filter(p=>p!==owner&&!contribs.includes(p)&&prim(p.profile)===t).sort((x,y)=>val(y,a)-val(x,a));rev=c[0]||null}
  let so=1,sc=0;if(contribs.length){if(a.mode==='Whole team'){so=.3;sc=.7/contribs.length}else if(contribs.length===1){so=.65;sc=.35}else{so=.5;sc=.5/contribs.length}}
  const f=rev?.9:1;
  const put=(p,share,role)=>{const hh=h*share;const e=energy(p.profile,a.tag);p.load+=hh;p[e]+=hh;p.items.push({a,role,h:hh,e})};
  put(owner,so*f,'Owner');contribs.forEach(p=>put(p,sc*f,'Contributor'));if(rev)put(rev,.1,'Reviewer');
  rows.push({a,h,owner,contribs,rev})});
 const ord=orderedPhases().map(p=>p.k);
 rows.sort((x,y)=>ord.indexOf(x.a.ph)-ord.indexOf(y.a.ph)||S.acts.indexOf(x.a)-S.acts.indexOf(y.a));
 people.forEach(p=>p.items.sort((x,y)=>ord.indexOf(x.a.ph)-ord.indexOf(y.a.ph)||S.acts.indexOf(x.a)-S.acts.indexOf(y.a)));
 const ownedIn=(p,f)=>p.items.filter(i=>i.role==='Owner'&&f(i.a)).reduce((s,i)=>s+i.h,0);
 const lead=[...people].sort((x,y)=>ownedIn(y,a=>LEADSET.has(a.tax))-ownedIn(x,a=>LEADSET.has(a.tax)))[0];
 const phaseOwners=orderedPhases().filter(p=>!p.ongoing&&S.acts.some(a=>a.ph==p.k)).map(ph=>({ph,p:[...people].sort((x,y)=>ownedIn(y,a=>a.ph==ph.k)-ownedIn(x,a=>a.ph==ph.k))[0]}));
 return {hc,ideal,people,rows,usingRoster,lead,phaseOwners}}

const FR=[
 {id:'handoff',a:p=>p.profile==='WHY-WHAT',b:p=>prim(p.profile)==='HOW',title:'Handoff gaps',what:'Direction gets handed off with confidence, and the gaps in it surface later, when the person executing hits them.',
  steps:(a,b,act)=>[`When ${a} hands off ${act}, spend ten minutes with ${b} on a Handoff Contract: what is decided, what is still open, and who closes each open item by when.`,`Have ${b} review ${a}'s drafts before they reach the client, so execution gaps surface while they are cheap to fix.`,`Write a definition of done with ${b} for each deliverable ${a} owns, before the work starts.`],tools:[42,10,7]},
 {id:'tissue',a:p=>p.profile==='WHAT-WHY',b:p=>prim(p.profile)==='HOW',title:'Connective tissue',what:'Work moves milestone to milestone, and the detail work between milestones lands on the HOW-primary without being planned.',
  steps:(a,b,act)=>[`Write a definition of done with ${b} for each milestone ${a} owns, before work starts.`,`Keep a shared Detail Debt Log of the detail work each milestone creates, and assign it in the weekly check-in rather than leaving ${b} to absorb it.`,`Book that detail work into fixed blocks instead of the last days of the phase.`],tools:[7,4,5]},
 {id:'trust',a:p=>p.profile==='WHAT-HOW',b:p=>prim(p.profile)==='WHY',title:'Direction trust',what:'Once execution is moving, questions about direction read as obstruction, so they get raised late or not at all.',
  steps:(a,b,act)=>[`Put a direction check on the calendar at the end of each phase, run by ${b}, so direction questions have a set place instead of landing mid-sprint.`,`${b} raises a concern as a specific risk to the client's stated goal, not as a general reopening of the direction.`,`Before ${a} commits effort to ${act}, spend ten minutes with the Problem Reframe Deck.`],tools:[26,23]},
 {id:'system',a:p=>p.profile==='HOW-WHAT',b:p=>prim(p.profile)==='WHY',title:'System disruption',what:'A change of direction can undo structure that is already working, so it meets resistance unless the case for it is specific.',
  steps:(a,b,act)=>[`When ${b} wants to change direction, show ${a} the specific evidence of what is not working before proposing the change.`,`Agree at kickoff which parts of the plan are fixed and which stay open, and who decides each.`,`Bring ${a} into ${act} at the start, not after the direction is set.`],tools:[39,23]},
 {id:'deploy',a:p=>p.profile==='HOW-WHY',b:p=>prim(p.profile)==='WHAT',title:'Deployment pressure',what:'Refinement continues past the point where the work could ship, while the WHAT-primary pushes to deliver.',
  steps:(a,b,act)=>[`At kickoff, set a decision date for ${act} and each other deliverable ${a} owns, and write down what complete enough means for each.`,`${b} owns the delivery date and ${a} owns the quality bar. Agree both in writing with the person receiving the work.`,`Share a working draft of ${act} at its halfway point, not at the end.`],tools:[13,11]},
 {id:'timing',a:p=>prim(p.profile)==='WHY',b:p=>prim(p.profile)==='WHAT',title:'Timing',what:'Purpose questions arrive at the moment the team is ready to execute.',
  steps:(a,b,act)=>[`Run the kickoff so the why, the what and the how each have a written answer before work starts.`,`Give ${a} a standing slot at the start of the weekly check-in for direction questions, so they land there and not at decision points.`,`Record each decision with its reason. Reopening a decision needs new information, not a new question.`],tools:[36,13]},
 {id:'action',a:p=>prim(p.profile)==='WHAT',b:p=>prim(p.profile)==='HOW',title:'Action versus completeness',what:'One side wants to move, the other wants to understand first, and each reads the other as the obstacle.',
  steps:(a,b,act)=>[`For ${act}, agree what ready to move means before the work starts.`,`Protect ${b}'s depth work in fixed blocks so ${a} can see when it will end.`],tools:[11,5]}];
function friction(R){const out=[];
 FR.forEach(f=>{const A=R.people.filter(f.a),B=R.people.filter(f.b);if(!A.length||!B.length)return;let best=null;
  A.forEach(a=>B.forEach(b=>{if(a===b)return;const sh=R.rows.filter(r=>{const on=[r.owner,...r.contribs,r.rev];return on.includes(a)&&on.includes(b)});if(!best||sh.length>best.sh.length)best={a,b,sh}}));
  if(!best)return;const own=best.sh.find(r=>r.owner===best.a)||R.rows.find(r=>r.owner===best.a)||best.sh[0];
  const act=own?own.a.name.toLowerCase():'shared work';
  out.push({...f,pa:best.a,pb:best.b,sh:best.sh,list:f.steps(esc(best.a.name),esc(best.b.name),esc(act))})});
 return out.sort((x,y)=>y.sh.length-x.sh.length).slice(0,4)}

function gaps(R){const d=demand(S.acts),out=[];
 O.filter(o=>d[o]>=.2&&!R.people.some(p=>prim(p.profile)===o)).forEach(o=>out.push(`<b>No one on the team has ${o} as their primary orientation,</b> yet ${pct(d[o])} of this work demands it. Add a ${TAGS.filter(t=>prim(t)===o).join(' or ')}, or expect the ${o}-heavy work to drain whoever owns it.`));
 R.rows.filter(r=>energy(r.owner.profile,r.a.tag)==='D').forEach(r=>{const t=prim(r.a.tag);out.push(`<b>${esc(r.a.name)} has no natural owner.</b> ${esc(r.owner.name)} owns it, and the work sits in their tertiary orientation, so it will cost them energy. Add someone with ${t} as their primary, or keep it small and time-boxed with a reviewer.`+toolBtns(MIT[t].tools))});
 R.people.filter(p=>p.load>p.cap*1.0).forEach(p=>out.push(`<b>${esc(p.name)} is over capacity.</b> The plan gives them about ${H(p.load)}, ${pct(p.load/p.cap)} of their available time. Move a contributor role to someone with room, or raise their availability.`));
 if(R.usingRoster)R.people.filter(p=>!p.load).forEach(p=>out.push(`<b>${esc(p.name)} has no work on this plan.</b> Consider whether they are needed on this project.`));
 return out}

function pie(bp){let a0=-Math.PI/2,out='';const cx=100,cy=100,r=92;

  const a1=a0+v*2*Math.PI,x0=cx+r*Math.cos(a0),y0=cy+r*Math.sin(a0),x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1);

 <div class="sec"><div class="eyebrow">Roles</div><h2>Who carries what</h2><p>Every activity has one owner. Depending on how it is delivered, it may also have contributors and a reviewer.</p>${defs()}
 <div class="grid">${P.map(p=>personCard(p,R)).join('')}</div></div>

 <div class="sec"><div class="eyebrow">Owner and contributor matrix</div><h2>Every activity, every person</h2>
 <div class="row" style="gap:8px;align-items:center"><span class="badge E">${ELAB.E}</span><span class="badge N">${ELAB.N}</span><span class="badge D">${ELAB.D}</span><span class="small">Color shows what the role costs that person.</span></div>
 <div class="scroll"><table><thead><tr><th>Activity</th><th>Delivery</th><th>Hours</th>${P.map(p=>`<th>${esc(p.name)}<br><span style="font-weight:600;letter-spacing:0">${p.profile}</span></th>`).join('')}</tr></thead><tbody>
 ${R.rows.map((r,i)=>`${i===0||R.rows[i-1].a.ph!==r.a.ph?`<tr class="phrow"><td colspan="${P.length+3}">${esc(phase(r.a.ph).name)} · ${weeks(phase(r.a.ph))}</td></tr>`:''}
 <tr><td style="min-width:220px">${esc(r.a.name)}<div class="small">${r.a.tag}</div></td><td>${r.a.mode}</td><td class="small">${H(r.h)}</td>${P.map(p=>{const role=r.owner===p?'Owner':r.contribs.includes(p)?'Contributor':r.rev===p?'Reviewer':'';return `<td>${role?`<span class="badge ${energy(p.profile,r.a.tag)}">${role}</span>`:''}</td>`}).join('')}</tr>`).join('')}
 </tbody></table></div></div>

 <div class="sec"><div class="eyebrow">Coverage</div><h2>Gaps to close</h2>
 ${gp.length?gp.map(g=>`<div class="flag">${g}</div>`).join(''):'<div class="ok">Every orientation the work needs has a primary on the team, every activity has an owner who is energized or neutral doing it, and no one is over capacity.</div>'}
 ${R.usingRoster?`<p class="small" style="max-width:none">For comparison, the ideal shape for this work is ${R.ideal.map(s=>s.profile).join(', ')}.</p>`:''}</div>

 <div class="sec"><div class="eyebrow">Friction forecast</div><h2>Where the work will strain, and what to do</h2>
 ${fr.length?`<div class="grid">${fr.map(f=>`<div class="card"><h3>${f.title}</h3><div class="small" style="margin:4px 0 10px">${esc(f.pa.name)} (${f.pa.profile}) and ${esc(f.pb.name)} (${f.pb.profile})</div>
 <p style="font-size:14px">${f.what}</p>
 <div class="rl"><b>Where it shows up</b><div>${f.sh.length?list(f.sh.slice(0,3).map(r=>esc(r.a.name)+' ('+esc(phase(r.a.ph).name)+')')):'They share no activity directly, so it will show at phase handoffs and in check-ins.'}</div></div>
 <div class="rl"><b>What to do</b></div><ul class="plain">${f.list.map(s=>`<li>${s}</li>`).join('')}</ul>${toolBtns(f.tools)}</div>`).join('')}</div>`:'<div class="ok">None of the recurring friction patterns applies to this mix of profiles.</div>'}</div>

 <div class="actions"><button class="btn ghost" data-go="3">Change the roster</button><span class="small">PDF team brief and individual plan exports arrive in the build.</span></div>
 <div class="foot">Team Builder allocates work among people already chosen for a project. It offers insight for a human staffing decision and is never a ranking or selection of individuals. Skills in every activity can be learned. The model describes energy, never ability.</div></div>`}

function planView(p,R){const t=p.load||1;const ph=orderedPhases().filter(x=>p.items.some(i=>i.a.ph==x.k));
 const others=r=>[r.owner,...r.contribs,r.rev].filter(x=>x&&x!==p);
 const rowOf=a=>R.rows.find(r=>r.a===a);
 const roleOf=(r,x)=>r.owner===x?'Owner':r.rev===x?'Reviewer':'Contributor';
 const what=(i,r)=>i.role==='Owner'?`Own the plan and the output. Set the approach, do most of the work${r.contribs.length?', agree with '+list(r.contribs.map(x=>esc(x.name)))+' which piece each delivers,':''} and bring the result to review.`
  :i.role==='Contributor'?`Deliver the piece agreed with ${esc(r.owner.name)}, the owner, and flag anything blocking it early.`
  :`Review ${esc(r.owner.name)}'s draft for ${REVIEWFOR[prim(p.profile)]}. Review at the draft stage, not the final one.`;
 const coll={};p.items.forEach(i=>{const r=rowOf(i.a);others(r).forEach(x=>{(coll[x.k]=coll[x.k]||{x,acts:[]}).acts.push(i.a.name)})});
 const di=p.items.filter(i=>i.e==='D');const tt=tert(p.profile);
 return `<div class="stack" style="gap:32px"><div><button class="link" data-back="1">Back to the full result</button></div>
 <div class="sec"><div class="eyebrow">Individual plan</div><h1>${esc(p.name)}</h1>
 <div class="row" style="align-items:center;gap:12px"><span class="prof">${p.profile}</span><span style="font-weight:600">${p.role}</span>${R.lead===p?'<span class="chip">Engagement lead</span>':''}</div>
 <p>About ${H(p.load)} over ${S.weeks} weeks, ${pct(p.load/p.cap)} of available time. Owns ${p.items.filter(i=>i.role==='Owner').length} activities, contributes to ${p.items.filter(i=>i.role==='Contributor').length} and reviews ${p.items.filter(i=>i.role==='Reviewer').length}. Energizing ${pct(p.E/t)}, neutral ${pct(p.N/t)}, draining ${pct(p.D/t)}.</p></div>

 <div class="sec"><h2>The work, phase by phase</h2>
 ${ph.map(x=>`<div class="card"><div class="eyebrow">${esc(x.name)} · ${weeks(x)}</div>
 ${p.items.filter(i=>i.a.ph==x.k).map(i=>{const r=rowOf(i.a);const o=others(r);return `<div class="item"><div class="nm">${esc(i.a.name)}</div><div class="meta"><span class="badge ${i.e}">${i.role}</span><span class="small">${i.a.mode} · ${H(i.h)}</span></div>
 <p>${what(i,r)}</p><p class="small">${o.length?'Works with '+list(o.map(y=>esc(y.name)+' ('+roleOf(r,y).toLowerCase()+')'))+'.':'Solo work.'} ${ELAB[i.e].replace(/^\S+ /,'')} for ${esc(p.name)}.</p></div>`}).join('')}</div>`).join('')}</div>

 <div class="sec"><h2>Who to go to for what</h2><div class="grid">
 ${Object.values(coll).map(c=>`<div class="card"><div class="small">${c.x.profile}</div><h3>${esc(c.x.name)}</h3><p style="margin-top:6px;font-size:14px">Go to ${esc(c.x.name)} for ${GOTO[prim(c.x.profile)]}.</p><div class="rl"><b>Shared work</b><div>${list([...new Set(c.acts)].map(esc))}</div></div></div>`).join('')||'<p>No shared activities on this plan.</p>'}</div></div>

 <div class="sec"><h2>Watch for</h2>
 ${di.length?`<div class="flag"><b>${list(di.map(i=>esc(i.a.name)))}</b> ${di.length>1?'sit':'sits'} in ${tt}, ${esc(p.name)}'s tertiary orientation, and will cost energy. ${MIT[tt].t}${toolBtns(MIT[tt].tools)}</div>`:`<div class="ok">Nothing on this plan sits in ${tt}, ${esc(p.name)}'s tertiary orientation.</div>`}</div>
 <div><button class="link" data-back="1">Back to the full result</button></div></div>`}

function modal(){const m=document.getElementById('modal');if(S.tool==null){m.innerHTML='';return}const t=TOOLS[S.tool];
 m.innerHTML=`<div class="modal" data-close="1"><div class="box" role="dialog" aria-modal="true" aria-labelledby="mt"><div class="eyebrow">Tool ${S.tool} · ${t.c}</div><h2 id="mt">${esc(t.n)}</h2>
 <p>${t.d||'Part of the MindPrint™ Tertiary Support Library.'}</p><p class="small">In the build, this opens the tool in the MindPrint™ library with its worksheet.</p>
 <div><button class="btn small" data-close="1" id="mclose">Close</button></div></div></div>`;document.getElementById('mclose').focus()}

function render(){document.getElementById('app').innerHTML=`<div class="note"><b>Prototype.</b> Reading the document is simulated with a fictional sample statement of work. Everything after that step is live: edit phases, activities, delivery or the roster and the result recalculates.</div>`+steps()+[v1,v2,v3,v4][S.step-1]();modal()}
document.addEventListener('click',e=>{const t=e.target.closest('button,[data-close]');if(!t)return;const d=t.dataset;
 if(d.close&&(t.tagName==='BUTTON'||e.target===t)){S.tool=null;modal();return}
 if(d.tool){S.tool=+d.tool;modal();return}
 if(d.go){S.step=+d.go;S.plan=null;render();window.scrollTo(0,0)}
 else if(d.plan){S.plan=d.plan;render();window.scrollTo(0,0)}
 else if(d.back){S.plan=null;render();window.scrollTo(0,0)}
 else if(d.del){S.acts=S.acts.filter(a=>a.k!=d.del);render()}
 else if(d.delr){S.roster=S.roster.filter(r=>r.k!=d.delr);render()}
 else if(d.delph){S.phases=S.phases.filter(p=>p.k!=d.delph);render()}
 else if(d.add==='act'){S.acts.push({k:uid++,name:'New activity',tax:14,tag:TAX[13].tag,ph:orderedPhases()[0].k,share:3,mode:'Solo',src:'Added'});render()}
 else if(d.add==='person'){S.roster.push({k:uid++,name:'New person',profile:'HOW-WHAT',avail:100});render()}
 else if(d.add==='phase'){const last=Math.max(...S.phases.filter(p=>!p.ongoing).map(p=>p.end),0);S.phases.push(PH('New phase',last+1,last+2));render()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.tool!=null){S.tool=null;modal()}});
document.addEventListener('change',e=>{const t=e.target,d=t.dataset;
 if(d.f){S[d.f]=t.type==='checkbox'?t.checked:t.value;if(d.f!=='doc')render();return}
 if(d.ph){const p=S.phases.find(x=>x.k==d.ph);if(!p)return;p[d.p]=d.p==='name'?t.value:Math.max(1,+t.value||1);render();return}
 if(d.a){const a=S.acts.find(x=>x.k==d.a);if(!a)return;if(d.p==='tax'){a.tax=+t.value;if(a.tax>0)a.tag=TAX[a.tax-1].tag}else if(d.p==='share')a.share=Math.max(0,+t.value||0);else if(d.p==='ph')a.ph=+t.value;else a[d.p]=t.value;render();return}
 if(d.r){const r=S.roster.find(x=>x.k==d.r);if(!r)return;r[d.p]=d.p==='avail'?+t.value:t.value;render()}});
render();
</script>
